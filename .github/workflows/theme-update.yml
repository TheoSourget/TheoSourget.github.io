name: "Theme Update"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      # Setup mise
      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: |
          mise run install # install theme dependency

      - name: Update theme to latest commit
        run: |
          mise run update-to-main

      - name: Install Dart Sass
        run: |
          curl -fsSL https://github.com/sass/dart-sass/releases/download/1.108.2/dart-sass-1.108.2-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build
        run: |
          # build the site
          hugo --minify
          # remove file generated by the build
          rm -rf public/

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          title: Update theme
          labels: automerge
